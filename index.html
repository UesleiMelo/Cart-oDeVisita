<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Golos Text', sans-serif;
}

body {
    background:#f4f7f6;
    background-image: radial-gradient(circle at 10% 20%, rgba(69,178,207,0.08), transparent 50%),
                      radial-gradient(circle at 90% 80%, rgba(32,56,94,0.05), transparent 50%);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card {
    background:#ffffff;
    border-radius:24px;
    padding:30px 25px;
    max-width:360px;
    width:100%;
    text-align:center;
    box-shadow:0 15px 35px rgba(32,56,94,0.12);
    border-top:8px solid #20385e;
    position:relative;
    overflow:hidden;
}

.card::after {
    content:'';
    position:absolute;
    bottom:-30px;
    right:-30px;
    width:100px;
    height:100px;
    background:#fecb4b;
    border-radius:50%;
    opacity:0.15;
}

/* LOGO */
.logo img {
    width:120px;
    margin-bottom:15px;
}

/* FOTO */
.avatar {
    width:110px;
    height:110px;
    border-radius:50%;
    overflow:hidden;
    margin:0 auto 20px;
    border:4px solid #45b2cf;
}

.avatar img {
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 25%;
}

/* TEXTOS */
h1 {
    color:#20385e;
    font-size:24px;
    margin-bottom:6px;
}

.role {
    color:#45b2cf;
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1.5px;
}

.company {
    margin:15px 0 25px;
    font-weight:600;
    color:#232323;
}

/* BOTÕES */
.btn {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:14px;
    border-radius:12px;
    margin-bottom:12px;
    text-decoration:none;
    color:#ffffff;
    font-weight:600;
    transition:0.2s;
}

.btn:hover {
    transform:translateY(-2px);
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.btn-save { background:#20385e; }
.btn-save:hover { background:#162744; }

.btn-whatsapp { background:#25d366; }

.btn-email { background:#45b2cf; }

.btn-linkedin { background:#0077b5; }
.btn-linkedin:hover { background:#005f8d; }

/* FOOTER */
.footer {
    margin-top:20px;
    font-size:12px;
}

.footer a {
    color:#45b2cf;
    text-decoration:none;
    font-weight:600;
}
</style>
