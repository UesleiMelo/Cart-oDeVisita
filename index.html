<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Cores do Manual de Marca do IAV:
           Azul Escuro: #20385e
           Azul Claro: #45b2cf
           Amarelo: #fecb4b
           Texto Escuro: #232323
           Fundo Claro: #f4f7f6
        */
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Golos Text', sans-serif; }
        
        body { 
            background-color: #f4f7f6; 
            background-image: radial-gradient(circle at 10% 20%, rgba(69, 178, 207, 0.08) 0%, transparent 50%),
                              radial-gradient(circle at 90% 80%, rgba(32, 56, 94, 0.05) 0%, transparent 50%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        
        .card { 
            background: #ffffff; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(32, 56, 94, 0.12); 
            width: 100%; 
            max-width: 360px; 
            padding: 35px 25px; 
            text-align: center; 
            border-top: 8px solid #20385e; 
            position: relative;
            overflow: hidden;
        }

        /* Detalhe sutil da curva amarela do IAV no fundo */
        .card::after {
            content: '';
            position: absolute;
            bottom: -30px;
            right: -30px;
            width: 100px;
            height: 100px;
            background: #fecb4b; 
            border-radius: 50%;
            opacity: 0.15;
            z-index: 0;
        }
        
        .avatar-container {
            position: relative;
            z-index: 1;
        }

        .avatar-img { 
            width: 110px; 
            height: 110px; 
            border-radius: 50%; 
            object-fit: cover; 
            object-position: center top;
            margin: 0 auto 20px; 
            border: 4px solid #45b2cf; 
            box-shadow: 0 4px 12px rgba(32, 56, 94, 0.15);
            display: block;
        }
        
        h1 { font-size: 24px; color: #20385e; font-weight: 700; margin-bottom: 6px; }
        
        .role { 
            font-size: 13px; 
            color: #45b2cf; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            margin-bottom: 4px; 
        }
        
        .company { font-size: 16px; color: #232323; font-weight: 600; margin-bottom: 30px; }
        
        .buttons-container {
            position: relative;
            z-index: 1;
        }

        .btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            color: #ffffff; 
            text-decoration: none; 
            padding: 14px; 
            border-radius: 12px; 
            margin-bottom: 14px; 
            font-weight: 600; 
            font-size: 15px;
            transition: all 0.2s ease; 
            cursor: pointer;
            border: none;
            width: 100%;
        }
        
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .btn-save { background-color: #20385e; } 
        .btn-save:hover { background-color: #162744; }
        
        .btn-whatsapp { background-color: #25d366; } 
        .btn-whatsapp:hover { background-color: #1ebd56; }
        
        .btn-email { background-color: #45b2cf; } 
        .btn-email:hover { background-color: #339db9; }
        
        .footer { font-size: 11px; color: #7f8c8d; margin-top: 25px; font-weight: 400; }
        .footer a { color: #45b2cf; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
